#server.address=0.0.0.0

#timeout values
connection.timeout=20
response.timeout=20
connection.request.timeout=20
healthcheck.cron=0 0/1 * * * *
healthcheck.enabled=true
service-management.enabled=true
alert-management.enabled=true
alert.cron=0 0/1 * * * *

spring.main.banner-mode=OFF
server.port=9092
server.servlet.context-path= /service-pulse-app
spring.application.name = service-pulse-app
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:3306/service-pulse-app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:ravi}
spring.datasource.password=${DB_PASSWORD:ravi}
spring.jmx.enabled = true
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30000
spring.jpa.show-sql = false
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
logging.level.org.hibernate.SQL=INFO
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ssZ
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=true
management.info.env.enabled=true
management.endpoints.web.cors.allowed-origins=*

# SSH authentication & keyless OpenSSH CA certificate properties
ssh.username=${SSH_USERNAME:ravi}
ssh.auth-mode=${SSH_AUTH_MODE:CA_CERTIFICATE}
ssh.strict-host-key-checking=false
ssh.port=22
ssh.connect-timeout-millis=10000
ssh.command-timeout-seconds=120

# SSH CA (HashiCorp Vault / OpenSSH Certificate Authority)
ssh.ca.type=${SSH_CA_TYPE:VAULT}
ssh.ca.endpoint=${SSH_CA_ENDPOINT:http://127.0.0.1:8200}
ssh.ca.token=${SSH_CA_TOKEN:root}
ssh.ca.role=${SSH_CA_ROLE:servicepulse-runner}
ssh.ca.mount=${SSH_CA_MOUNT:ssh}
ssh.ca.principals=${SSH_CA_PRINCIPALS:ravi,ubuntu,ec2-user,servicepulse}
ssh.ca.key-algorithm=${SSH_CA_KEY_ALGORITHM:ED25519}
ssh.ca.cert-ttl-minutes=${SSH_CA_CERT_TTL_MINUTES:60}
ssh.ca.renew-threshold-percentage=${SSH_CA_RENEW_THRESHOLD_PERCENTAGE:75}

# Fallback static key configuration (used when ssh.auth-mode=STATIC)
ssh.private-key-path=${SSH_PRIVATE_KEY_PATH:C:/Users/Ravi/.ssh/id_ed25519_auth_wms}
ssh.private-key-passphrase=${SSH_PRIVATE_KEY_PASSPHRASE:sshpassphrase}
ssh.known-hosts-path=${SSH_KNOWN_HOSTS_PATH:C:/Users/Ravi/.ssh/known_hosts}