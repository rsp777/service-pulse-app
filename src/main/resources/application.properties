#server.address=0.0.0.0

#timeout values
connection.timeout=${CONNECTION_TIMEOUT:20}
response.timeout=${RESPONSE_TIMEOUT:20}
connection.request.timeout=${CONNECTION_REQUEST_TIMEOUT:20}
healthcheck.cron=${HEALTHCHECK_CRON:0 0/1 * * * *}

spring.main.banner-mode=OFF
server.port=${SERVER_PORT:9092}
server.servlet.context-path= /service-pulse-app
spring.application.name = service-pulse-app
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/service-pulse-app}
spring.datasource.username=${DB_USERNAME:ravi}
spring.datasource.password=${DB_PASSWORD:ravi}
spring.jmx.enabled = true
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30000
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=DEBUG
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ssZ
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
management.endpoint.shutdown.enabled=${MANAGEMENT_ENDPOINT_SHUTDOWN_ENABLED:false}
management.info.env.enabled=${MANAGEMENT_INFO_ENV_ENABLED:true}

# SSH key authentication for remote Linux command execution.
ssh.username=${SSH_USERNAME:}
ssh.private-key-path=${SSH_PRIVATE_KEY_PATH:}
ssh.private-key-passphrase=${SSH_PRIVATE_KEY_PASSPHRASE:}
ssh.known-hosts-path=${SSH_KNOWN_HOSTS_PATH:}
ssh.strict-host-key-checking=${SSH_STRICT_HOST_KEY_CHECKING:false}
ssh.port=${SSH_PORT:22}
ssh.connect-timeout-millis=${SSH_CONNECT_TIMEOUT_MILLIS:10000}
ssh.command-timeout-seconds=${SSH_COMMAND_TIMEOUT_SECONDS:60}