name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      USERNAME:
        required: true
        type: string

    secrets:
      PASSWORD:
        required: true
      REPO_URL:
        required: true
      REPO_NAME:
        required: true

jobs:
  docker-build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout LATEST HEAD of the branch — NOT the triggering SHA.
      # The maven-build job bumps the version and pushes a new commit back to
      # the branch. If we checked out the original SHA, we'd read the OLD version
      # from pom.xml and try to download the wrong JAR from Artifactory.
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # Always pull the tip of the branch

      # 2. Set up JDK (needed for Maven commands)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # 3. Configure Maven settings for Artifactory access
      - name: Setup Maven settings
        uses: s4u/maven-settings-action@v4.0.0
        with:
          override: true
          servers: |
            [{"id":"github","username":"${{ inputs.USERNAME }}","password":"${{ secrets.PASSWORD }}"}]
          repositories: |
            [{"id":"github","name":"${{ secrets.REPO_NAME }}","url":"${{ secrets.REPO_URL }}","snapshots":{"enabled":true}}]

      # 4. Extract Maven project coordinates (groupId, artifactId, version) from pom.xml
      - name: Resolve Maven coordinates
        env:
          GH_TOKEN: ${{ secrets.PASSWORD }}
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version 2>/dev/null | tr -d '\r\n')
          GROUP_ID=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.groupId 2>/dev/null | tr -d '\r\n')
          APP_NAME="${{ secrets.REPO_NAME }}"

          echo "Resolved -> groupId: $GROUP_ID | artifactId: $APP_NAME | version: $VERSION"
          echo "APP_VERSION=$VERSION"   >> $GITHUB_ENV
          echo "GROUP_ID=$GROUP_ID"     >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME"     >> $GITHUB_ENV

      # 5. Download the JAR that was published by the maven-build job
      - name: Download JAR from Artifactory
        run: |
          mkdir -p target
          mvn dependency:get -s $HOME/.m2/settings.xml \
            -DrepoUrl="${{ secrets.REPO_URL }}" \
            -Dartifact="${{ env.GROUP_ID }}:${{ env.APP_NAME }}:${{ env.APP_VERSION }}:jar" \
            -Ddest=target/app.jar

      # 6. Authenticate to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      # 7. Setup Docker Buildx for multi-platform support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. Build and push the Docker image, tagged with version and latest
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.APP_NAME }}:${{ env.APP_VERSION }}
            ghcr.io/${{ github.repository_owner }}/${{ env.APP_NAME }}:latest
