version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: service-pulse-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ravi
      MYSQL_DATABASE: service-pulse-app
      MYSQL_USER: ravi
      MYSQL_PASSWORD: ravi
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - service-pulse-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ravi", "-pravi"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-pulse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-pulse-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      DB_URL: jdbc:mysql://db:3306/service-pulse-app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ravi
      DB_PASSWORD: ravi
      SERVER_PORT: 9092
      LIQUIBASE_ENABLED: "true"
      HEALTHCHECK_ENABLED: "true"
      SERVICE_MANAGEMENT_ENABLED: "true"
    networks:
      - service-pulse-net

networks:
  service-pulse-net:
    driver: bridge

volumes:
  mysql_data:
